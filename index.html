<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TLLJ Partnerships Desk</title>
<script>try{var t=localStorage.getItem("tllj_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#630551"><meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TLLJ Desk">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css"></head><body>
<div class="wrap">
<header>
 <div class="top"><h1>TLLJ Partnerships Desk</h1><span id="modesw"></span><div class="row"><div class="sub" id="sub"></div><button class="btn" id="undo" data-act="undo" disabled>Undo</button><span id="tools" class="row"><button class="btn" data-act="search" title="Search everything (press /)">Search</button><button class="btn" id="tillybtn" data-act="tilly">Tilly</button><button class="btn" data-act="export">Export</button></span><button class="btn" id="apprbtn" data-act="tab" data-id="approvals" hidden>Approvals</button><button class="btn" id="notesbtn" data-act="tab" data-id="notes">Suggestions</button><button class="btn" id="themebtn" data-act="theme" aria-label="Switch between light and dark">Dark</button><button class="btn" data-act="settings">Settings</button><button class="btn" id="signout" data-act="signout" hidden aria-label="Sign out" title="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button></div></div>
 <nav id="nav"></nav>
</header>
<main id="main"><p class="empty">Loading the plan, pipeline and events.</p></main>
</div>
<dialog id="dlg"></dialog><dialog id="dlg2"></dialog>
<div id="toast" class="toast" hidden></div>
<script>
let END='2026-12-14', START='2026-11-02';
const STATUSES=['Not started','Finding the contact','Contact found','First message sent','In conversation','Proposal sent','Negotiating','Agreed','Declined','On hold'];
const ACTIVE=['First message sent','In conversation','Proposal sent','Negotiating','Agreed'];
const LIVE=['In conversation','Proposal sent','Negotiating'];
const COLS=['tasks','events','pipe','log','contacts','kit','prep','deals','decisions','activity','evsug','notes'];
let MODE=['p','c'].includes(lsGet('tllj_mode'))?lsGet('tllj_mode'):'s';
const S={loaded:{},tab:'today',fo:'All',fw:'All',fs:'All',fc:'Missing',ai:{}};
COLS.forEach(c=>S[c]=[]);
let db=null,sample=null,EDIT=true,CONTRIB=false;
const CACTS=new Set(['search','gosearch','edit','new','newsp','editfull','quickc','addcontact','addlog']);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let TODAY=iso(new Date());
const dd=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const DL=()=>pd(END).toLocaleDateString('en-GB',{day:'numeric',month:'long'}),DS=()=>pd(END).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const TG0={label:'one signed sponsorship',goal:1,date:'2026-12-14',start:'2026-11-02',history:[]};
const tgt=()=>({...TG0,...(get('kit','target')||{})});
function applyTarget(){const t=tgt();if(/^\d{4}-\d\d-\d\d$/.test(t.date)) END=t.date;if(/^\d{4}-\d\d-\d\d$/.test(t.start)) START=t.start}
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?pd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'No date';
const rel=s=>{const n=dd(TODAY,s);return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n<0?(-n)+' days overdue':'in '+n+' days'};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dOK=v=>/^\d{4}-\d\d-\d\d$/.test(v||'');
const get=(c,id)=>S[c].find(x=>x.id===id);
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800)}

/* ---------- data layer with undo ---------- */
let cur=null;const hist=[];
function rec(col,id){if(cur){const p=get(col,id);cur.push({col,id,prev:p?{...p}:null})}}
function renderUndo(){const b=$('#undo');if(!b) return;const h=hist[hist.length-1];b.hidden=!EDIT;b.disabled=!h;b.textContent=h?'Undo: '+h.label:'Undo';b.title='Undo the last change (Ctrl+Z)'}
async function act(label,fn){cur=[];let items=[];try{await fn()}finally{items=cur||[];if(items.length){hist.push({label,items});if(hist.length>30)hist.shift()}cur=null;renderUndo();if(items.length) recordActivity(label,items)}}
function local(col,id,d){const i=S[col].findIndex(x=>x.id===id);if(d==null){if(i>=0) S[col].splice(i,1)}else if(i<0) S[col].push({...d});else S[col][i]={...d}}
async function undo(){const b=hist.pop();renderUndo();if(!b){toast('Nothing to undo');return}
  try{for(const it of b.items.slice().reverse()){const r=db.collection(it.col).doc(it.id);if(it.prev){await r.set(it.prev);local(it.col,it.id,it.prev)}else{await r.delete();local(it.col,it.id,null)}}toast('Undid: '+b.label);recordActivity('Undid: '+b.label,[]);if(!$('#dlg').open) render()}catch(e){toast('Could not undo: '+(e.message||''))}}
const LOCKED=['target','team','rates','terms','audience'];
async function save(col,id,data){
  if(ASSIST&&col==='kit'&&LOCKED.includes(id)){toast('That setting is kept for Sade and Fatimah.');return false}
  if(!db){toast('Saving is not available in this view.');return false}
  rec(col,id);
  try{await db.collection(col).doc(id).set({...data,id});local(col,id,{...data,id});return true}catch(e){toast('Not saved: '+(e.message||'check edit access'));return false}
}
async function patch(col,id,p){const c=get(col,id)||{};return save(col,id,{...c,...p})}
async function remove(col,id){if(ASSIST){toast('Deleting is kept for Sade and Fatimah.');return}rec(col,id);try{await db.collection(col).doc(id).delete();local(col,id,null)}catch(e){toast('Not deleted: '+(e.message||''))}}

/* ---------- facts ---------- */
const open=()=>S.tasks.filter(t=>!t.done);
const byDue=(a,b)=>(a.due||'9')<(b.due||'9')?-1:1;
const logsOf=id=>S.log.filter(l=>l.pipeId===id).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
const contactsOf=id=>S.contacts.filter(c=>c.pipeId===id);
const hasContact=id=>contactsOf(id).some(c=>c.email||c.phone);
function lastOf(id,types){const l=logsOf(id).find(x=>types.includes(x.type));return l?l.date:null}
const conflictFor=p=>p.category?S.pipe.filter(q=>q.id!==p.id&&q.category===p.category&&ACTIVE.includes(q.status)):[];
function conflicts(){const m={};S.pipe.filter(p=>p.category&&ACTIVE.includes(p.status)).forEach(p=>(m[p.category]=m[p.category]||[]).push(p));return Object.entries(m).filter(([,a])=>a.length>1)}
function stdPrep(e){
  const f=addDays(e.end,2);
  return [
   ['Before',`Confirm access: ${e.status||'status not recorded'}`],['Before',`Decide who goes (now: ${e.who||'To decide'}) and which day`],
   ['Before',`Choose the people to meet from: ${(e.reach||'no names recorded').slice(0,160)}`],['Before','Write three questions for each person on the meeting list'],
   ['Before','Pack the one-line description, the reach figures Fatimah has approved and one sample feature link'],
   ['During','Collect passes or register on arrival'],['During','Meet the people on the list and ask the questions'],['During','Log every conversation in the sponsor\'s outreach log the same day'],
   ['After',`Send follow-up emails by ${fmt(f)} (within 48 hours of the end)`],['After','Log replies and update each sponsor\'s next step'],['After','Add coverage and photos to the editorial plan']
  ].map(([phase,text])=>({phase,text}));
}
function sug(){
  const out=[];const add=(text,why,due,pid)=>{if(!S.tasks.some(t=>!t.done&&t.action===text)&&!out.some(o=>o.text===text)) out.push({text,why,due:due||TODAY,pid})};
  for(const p of S.pipe){
    if(['Declined','On hold','Agreed'].includes(p.status)) continue;
    const out_=lastOf(p.id,['Email sent']),in_=lastOf(p.id,['Email received','Call','Meeting']);
    if(out_&&(!in_||in_<out_)){const n=dd(out_,TODAY);if(n>=7) add(`Chase ${p.group}: no reply in ${n} days`,`Last email sent ${fmt(out_)}. Nothing received since.`,TODAY,p.id)}
    if(p.status==='In conversation'&&in_&&dd(in_,TODAY)>=3&&(!out_||out_<=in_)) add(`Reply to ${p.group} or send the proposal`,`They last responded ${fmt(in_)}. No email from us since.`,TODAY,p.id);
    if(p.status==='Not started'&&p.when==='Start now'&&!hasContact(p.id)) add(`Find a contact route for ${p.group}`,'First wave, with no email or phone entered yet.',addDays(TODAY,1),p.id);
    if(p.status==='Contact found') add(`Send the first email to ${p.group}`,'A contact is entered and no message has gone.',TODAY,p.id);
  }
  for(const e of S.events){
    const n=dd(TODAY,e.start),pr=S.prep.filter(x=>x.eventId===e.id);
    if(n>=0&&n<=3&&(!pr.length||pr.some(x=>x.phase==='Before'&&!x.done))) add(`Finish prep for ${e.name}`,`Starts ${rel(e.start)}${pr.length?'':'. No checklist yet.'}`,TODAY);
    if(e.end<=TODAY&&dd(e.end,TODAY)<=2&&pr.some(x=>x.phase==='After'&&!x.done)) add(`Send follow-up emails after ${e.name}`,`Due by ${fmt(addDays(e.end,2))}.`,addDays(e.end,2));
  }
  for(const d of S.deals){const p=get('pipe',d.pipeId);if(!p) continue;
    if(dOK(d.publishDate)&&d.publishDate<=TODAY&&d.invoice==='Not invoiced') add(`Invoice ${p.group}`,`Published ${fmt(d.publishDate)}. No invoice recorded.`,TODAY,p.id);
    if(dOK(d.renewal)&&dd(TODAY,d.renewal)<=30&&dd(TODAY,d.renewal)>=0) add(`Open the renewal conversation with ${p.group}`,`Renewal ${fmt(d.renewal)}.`,TODAY,p.id)}
  const signed=S.pipe.some(p=>p.status==='Agreed'),pend=S.pipe.some(p=>['Proposal sent','Negotiating'].includes(p.status));
  if(!signed&&!pend&&dd(TODAY,END)<=21){const fb=(get('kit','fallbacks')||{items:[]}).items.map(f=>S.pipe.find(p=>p.group===f.group)).find(p=>p&&!ACTIVE.includes(p.status));if(fb) add(`Send the proposal to ${fb.group}`,`No proposal is out and ${dd(TODAY,END)} days remain. ${fb.group} is a named cash fallback.`,TODAY,fb.id)}
  {const x=SUGX();return out.filter(o=>!x.has(o.text))}
}

/* ---------- list pieces ---------- */
function taskItem(t){
  const late=!t.done&&t.due&&t.due<TODAY;
  return `<div class="item"><input type="checkbox" data-act="tick" data-id="${t.id}" ${t.done?'checked':''} ${EDIT?'':'disabled'} aria-label="Done"><div><div class="t" data-act="edit" data-col="tasks" data-id="${t.id}">${esc(t.action)}</div><div class="meta"><span class="pill ${late?'warn':''}">${esc(fmt(t.due))}${t.due&&!t.done?' · '+rel(t.due):''}</span><span>${esc(t.owner)}</span><span>${esc(t.target)}</span>${t.was?`<span>was ${esc(fmt(t.was))}</span>`:''}</div></div></div>`;
}
function pipeItem(p){
  const late=p.nextDate&&p.nextDate<TODAY;
  return `<div class="item"><span></span><div><div class="t" data-act="edit" data-col="pipe" data-id="${p.id}"><b>${esc(p.group)}</b>: ${esc(p.next)}</div><div class="meta"><span class="pill ${late?'warn':'gold'}">${esc(dtx(p.nextDate,p.nextTime))}${p.nextDate?' · '+rel(p.nextDate):''}</span><span>${esc(p.owner)}</span><span>${esc(p.status)}</span></div></div></div>`;
}
function evRow(e){
  const live=e.start<=TODAY&&e.end>=TODAY,pr=S.prep.filter(x=>x.eventId===e.id),dn=pr.filter(x=>x.done).length;
  return `<div class="ev" data-act="edit" data-col="events" data-id="${e.id}"><b>${esc(e.name)}</b><div class="meta"><span class="pill ${live?'ok':''}">${live?'On now':fmt(e.start)+' · '+rel(e.start)}</span><span>${esc(evDates(e))}</span><span>${esc(e.where)}</span></div><div class="meta">${esc(e.status||'')}</div>${EDIT?`<div class="meta"><button class="btn sm" data-act="prepopen" data-id="${e.id}">Prep ${pr.length?dn+'/'+pr.length:''}</button></div>`:''}</div>`;
}
const SUGX=()=>{try{return new Set(JSON.parse(lsGet('tllj_sugx')||'[]'))}catch(e){return new Set()}};
function sugItem(s,i,k){
  return `<div class="item"><span></span><div><b>${esc(s.text)}</b><div class="meta"><span>${esc(s.why||'')}</span></div><div class="meta"><span class="pill gold">${esc(fmt(s.due))}</span>${EDIT?`<button class="btn sm" data-act="addsug" data-k="${k}" data-id="${i}">Add to plan</button><button class="btn sm xbtn" data-act="sugx" data-k="${k}" data-id="${i}" aria-label="Dismiss this suggestion" title="Dismiss">×</button>`:''}${s.pid&&EDIT?`<button class="btn sm" data-act="edit" data-col="pipe" data-id="${s.pid}">Open sponsor</button>`:''}</div></div></div>`;
}

/* ---------- Follow-ups ---------- */
const FUS=()=>S.kit.filter(k=>k.type==='followup'&&(k.mode==='Both'||(k.mode==='P')===(MODE==='p')));
const MON=['january','february','march','april','may','june','july','august','september','october','november','december'];
const MON3=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WKD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
function monIdx(w){w=w.replace(/\./g,'');let i=MON.indexOf(w);if(i<0&&w.length>=3){i=MON3.indexOf(w.slice(0,3));if(i>=0&&!MON[i].startsWith(w.slice(0,3)))i=-1;if(i>=0&&w.length>3&&!MON[i].startsWith(w))i=(w==='sept')?8:-1}return i}
function lastDay(y,m){return iso(new Date(y,m+1,0))}
function parseWhen(txt){
  const t=' '+txt.toLowerCase().replace(/[,.;]/g,' ').replace(/\s+/g,' ')+' ',n0=pd(TODAY),Y=n0.getFullYear(),M=n0.getMonth();
  let m;
  if((m=t.match(/(\d{4}-\d\d-\d\d)/))) return m[1];
  if(/ (today|tonight) /.test(t)) return TODAY;
  if(/ tomorrow /.test(t)) return addDays(TODAY,1);
  if((m=t.match(/ in (a|an|one|two|three|four|five|six|seven|eight|nine|ten|twelve|\d+) (day|week|month)s? /))){const k=NUMW[m[1]]||+m[1];if(m[2]==='day') return addDays(TODAY,k);if(m[2]==='week') return addDays(TODAY,7*k);const d=new Date(Y,M+k,n0.getDate());return iso(d)}
  if((m=t.match(/ (end|late|close) of (?:the )?(month|week|\w+) /))){const w=m[2];if(w==='month') return lastDay(Y,M);if(w==='week'){const d=n0.getDay();return addDays(TODAY,(5-d+7)%7||7)}const i=monIdx(w);if(i>=0){let y=Y;if(i<M) y++;return lastDay(y,i)}}
  if((m=t.match(/ (start|beginning|early) of (?:the )?(\w+) /))){const i=monIdx(m[2]);if(i>=0){let y=Y;if(i<M||(i===M&&n0.getDate()>1)) y++;return iso(new Date(y,i,1))}}
  if((m=t.match(/ mid[ -]?(\w+) /))){const i=monIdx(m[1]);if(i>=0){let y=Y;if(i<M||(i===M&&n0.getDate()>15)) y++;return iso(new Date(y,i,15))}}
  if((m=t.match(/ next (week|month) /))){if(m[1]==='week'){const d=n0.getDay();return addDays(TODAY,(8-d)%7||7)}return iso(new Date(Y,M+1,1))}
  if((m=t.match(/ (?:next |on |this |by )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday) /))){const k=WKD.indexOf(m[1]);let diff=(k-n0.getDay()+7)%7;if(diff===0||/ next /.test(t)&&diff<7&&n0.getDay()!==0&&false) diff=7;return addDays(TODAY,diff)}
  const mp='(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec)';
  if((m=t.match(new RegExp(' (\\d{1,2})(?:st|nd|rd|th)?(?: of)? '+mp+' ')))||(m=null)){const i=monIdx(m[2]),d=+m[1];if(i>=0&&d>=1&&d<=31){let y=Y;let c=new Date(y,i,d);if(iso(c)<TODAY) c=new Date(y+1,i,d);return iso(c)}}
  if((m=t.match(new RegExp(' '+mp+' (\\d{1,2})(?:st|nd|rd|th)? ')))){const i=monIdx(m[1]),d=+m[2];if(i>=0&&d>=1&&d<=31){let y=Y;let c=new Date(y,i,d);if(iso(c)<TODAY) c=new Date(y+1,i,d);return iso(c)}}
  if((m=t.match(new RegExp(' (?:in|on|by|for|during) '+mp+' ')))&&m[1]!=='may'||(m=t.match(/ (?:in|on|by|for|during) (may) /))){const i=monIdx(m[1]);if(i>=0){let y=Y;if(i<M) y++;if(i===M) return lastDay(Y,M);return iso(new Date(y,i,1))}}
  return '';
}
function parseRepeat(txt){const t=txt.toLowerCase();let m;if((m=t.match(/every (\d+) days?/))) return +m[1];if(/every (other )?week|weekly/.test(t)) return 7;if(/every day|daily/.test(t)) return 1;return 3}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function matchLink(txt){
  const low=txt.toLowerCase(),words=low.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  let best={pipeId:'',who:'',score:0};
  const bump=(pipeId,who,score)=>{if(score>best.score) best={pipeId,who,score}};
  linkables().forEach(p=>{const g=p.group.toLowerCase();if(low.includes(g)) bump(p.id,'',100);const gs=slug(p.group);if(gs.length>=5){for(let n=1;n<=3;n++)for(let i=0;i+n<=words.length;i++){const w=words.slice(i,i+n).join('');if(w.length>=4&&(w===gs||(gs.length>=7&&lev(w,gs)<=Math.floor(gs.length/5)))) bump(p.id,'',80)}}});
  S.contacts.forEach(c=>{const nm=(c.name||'').toLowerCase().trim();if(!nm||nm.length>40||/[,(]/.test(nm)||nm.split(/\s+/).length>4) return;if(low.includes(nm)) bump(c.pipeId,c.name,95);const fn=nm.split(/\s+/)[0];if(fn.length>=4&&!/^(the|from|with|team|office|head|their|your)$/.test(fn)&&words.includes(fn)) bump(c.pipeId,c.name,60)});
  S.pipe.forEach(p=>{const fw=p.group.toLowerCase().split(/[^a-z0-9]+/)[0];if(fw.length>=5&&words.includes(fw)) bump(p.id,'',70)});
  if(!best.who){const m=txt.match(/\bwith ([A-Z][a-zA-Z'-]+(?: [A-Z][a-zA-Z'-]+)?)/);if(m&&!S.pipe.some(p=>p.group.toLowerCase().startsWith(m[1].toLowerCase().split(' ')[0]))) best.who=m[1]}
  return best;
}
function fuDue(f,t){if(f.done||!f.due) return false;if(f.due>t) return false;const n=Math.round((pd(t)-pd(f.due))/864e5),r=+f.repeat||0;return n===0||(r>0&&n%r===0)}
function fuNext(f){const r=+f.repeat||0;if(f.due>=TODAY||r<=0) return f.due;const n=dd(f.due,TODAY);return addDays(f.due,Math.ceil(n/r)*r)}
function fuRow(f,short){
  const p=f.pipeId&&(get('pipe',f.pipeId)||ptr(f.pipeId)),late=f.due<TODAY,n=dd(TODAY,f.due),cls=late?'late':f.due===TODAY?'today':n<=2?'soon':'',dt=pd(f.due);
  return `<div class="fu2 ${cls}"><div class="fdate"><b>${dt.getDate()}</b><span>${MON3[dt.getMonth()]}</span></div><div class="fbody">
  <input type="text" class="ghost" data-fu="${f.id}" data-k="text" value="${esc(f.text)}" aria-label="Follow-up" style="width:100%;font-weight:600">

function crc32(u8){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let r=-1;for(let i=0;i<u8.length;i++)r=t[(r^u8[i])&255]^(r>>>8);return (r^-1)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,f.data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+sz}
  const cdLen=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),0,0]);
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ----- banned words and style check ----- */
const BANNED=['quiet','quietly','tapestry','realm','unleash','testament','elevate','seamless','robust','leverage','delve','unpack','explore','genuinely','straightforward','honestly','boutique','transformative','pivotal','innovative','cutting-edge','groundbreaking','moreover','furthermore','ultimately','unlock','embark','unwavering','multifaceted','nuance','utilize','facilitate','optimal','unprecedented','synergy','magic','embrace','journey','resonate','captivating','foster','beacon','interplay','landscape','symphony','reimagine','redefine','vibrant','bustling','emerge','highlight','underscore','climate','dynamic','firstly','fabric','weave','woven','craft','reshape','narrative','significant','odyssey','spark','ignite','illuminate','empower','showcase','epic','masterful','intricate','mantra','unparalleled','vast','compelling','crucial','ensure','enhance','forge','imperative','trailblazer','solidify','undeniable','irresistible','mitigate','paramount','streamline','whether','beyond','arrive','arrival','craftsmanship','plethora','tailor','strive','navigate','superpower','masterclass','love letter'];
const BANRE=new RegExp('\\b('+BANNED.map(w=>w.replace(/[-]/g,'[- ]')).join('|')+')(s|d|ed|ing|es)?\\b','gi');
function styleCheck(t,ext){
  t=String(t||'');const out=[];
  if(/[\u2014\u2013]/.test(t)) out.push('Contains an em dash or en dash. Use a comma, colon or full stop.');
  const w=[...new Set((t.match(BANRE)||[]).map(x=>x.toLowerCase()))];if(w.length) out.push('Banned words: '+w.slice(0,12).join(', ')+'.');
  if(ext!==false&&/\bTLLJ\b/.test(t)) out.push('Write "The Leisurely Life Journal" in full in external copy.');
  if(/\b(not only|not just|isn't just|is not just)\b/i.test(t)) out.push('Contains a "not just" contrast. State the positive directly.');
  if(/\b(rather than|instead of)\b/i.test(t)) out.push('Contains "rather than" or "instead of". Restate as one positive claim.');
  if(ext!==false&&!/www\.theleisurelylifejournal\.com/.test(t)) out.push('The sign-off with the website and Instagram links is missing.');
  return out;
}

/* ----- dates, links, calendar ----- */
function gcal(title,date,time,loc,det){
  if(!date) return '';const d=date.replace(/-/g,'');let dates;
  if(time&&/^\d\d:\d\d$/.test(time)){const h=(+time.slice(0,2)+1)%24;dates=d+'T'+time.replace(':','')+'00/'+d+'T'+String(h).padStart(2,'0')+time.slice(3,5)+'00'}
  else dates=d+'/'+addDays(date,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+dates+(loc?'&location='+encodeURIComponent(loc):'')+(det?'&details='+encodeURIComponent(det):'');
}

/* ----- mail ----- */
const MC=()=>({url:lsGet('tllj_as_url'),sec:lsGet('tllj_as_sec'),zoho:lsGet('tllj_zoho_hook'),route:lsGet('tllj_route')||'mailto'});
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function tok(id,r){const c=MC();if(!c.sec||!crypto.subtle) return '';const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(c.sec),{name:'HMAC',hash:'SHA-256'},false,['sign']);return hex(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(id+':'+r))).slice(0,32)}
function composeUrl(m,route){
  const q=encodeURIComponent;
  if(route==='mailto') return 'mailto:'+(m.to||'')+'?subject='+q(m.subject||'')+'&body='+q(m.text||'')+(m.cc?'&cc='+q(m.cc):'');
  return 'https://mail.google.com/mail/?view=cm&fs=1&to='+q(m.to||'')+(m.cc?'&cc='+q(m.cc):'')+'&su='+q(m.subject||'')+'&body='+q(m.text||'');
}
async function sendMail(m){
  const c=MC();
  if(c.route==='script'&&c.url&&c.sec){
    try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:c.sec,action:'send',to:m.to,cc:m.cc||'',subject:m.subject,text:m.text,html:m.html||''})});const j=await r.json();if(j.ok){toast('Sent to '+m.to+'.');return true}toast('Not sent: '+(j.error||'the mailer refused the request'));return false}
    catch(e){toast('Could not reach the mailer. Opening Gmail instead.');window.open(composeUrl(m,'gmail'),'_blank','noopener');return false}
  }
  if(c.route==='zoho'&&c.zoho){
    try{await fetch(c.zoho,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({to:m.to,cc:m.cc||'',subject:m.subject,text:m.text,html:m.html||''})});toast('Passed to Zoho Flow for '+m.to+'. Check Zoho to confirm it went.');return true}
    catch(e){toast('Could not reach Zoho Flow.');return false}
  }
  if(c.route==='mailto'){location.href=composeUrl(m,'mailto');return true}
  window.open(composeUrl(m,'gmail'),'_blank','noopener');return true;
}
const deskLink=id=>location.origin+location.pathname+(id?'#appr='+id:'');
async function apprMail(d){
  const c=MC(),links={};
  if(c.url&&c.sec){for(const r of ['approved','changes','declined']) links[r]=c.url+'?a=r&id='+encodeURIComponent(d.id)+'&r='+r+'&t='+await tok(d.id,r)}
  const head='For your approval: '+(d.title||d.kind),body=d.body||'';
  const text='Hi Fatimah,\n\nSade has '+an(d.kind)+' ready for you.\n\n'+(d.to?'To: '+d.to+'\n':'')+(d.subject?'Subject: '+d.subject+'\n':'')+'\n'+body+'\n\n'+(links.approved?'Approve: '+links.approved+'\nAsk for changes: '+links.changes+'\nDecline: '+links.declined+'\n\n':'')+'Open it in the desk: '+deskLink(d.id)+'\n\nThank you.';
  const btn=(u,l,bg)=>`<a href="${u}" style="display:inline-block;padding:10px 18px;margin:0 8px 8px 0;border-radius:99px;background:${bg};color:#fff;text-decoration:none;font-family:Arial,sans-serif;font-size:14px">${l}</a>`;
  const html=`<div style="font-family:Arial,sans-serif;font-size:14px;color:#222;max-width:620px"><p>Hi Fatimah,</p><p>Sade has ${esc(an(d.kind))} ready for you.</p>${d.to?`<p style="color:#666">To: ${esc(d.to)}${d.subject?'<br>Subject: '+esc(d.subject):''}</p>`:''}<div style="border-left:3px solid #b8943f;padding:6px 14px;margin:12px 0;background:#faf7f0">${nl2(body)}</div>${links.approved?`<p>${btn(links.approved,'Approve','#2f6b45')}${btn(links.changes,'Ask for changes','#8a6d1f')}${btn(links.declined,'Decline','#8a3b3b')}</p>`:''}<p><a href="${deskLink(d.id)}">Open it in the desk</a></p></div>`;
  return {to:EML.Fatimah(),subject:head,text,html};
}

/* CSV and paste import */
function parseCsv(t){
  t=String(t||'').replace(/^﻿/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"') q=false;else c+=ch}
    else if(ch==='"') q=true;else if(ch===','||ch==='\t'){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n') i++;r.push(c);c='';if(r.some(x=>x.trim())) rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x.trim())) rows.push(r);return rows;
}
const STMAP={'new':'New','contacted':'Contacted','test sent':'Test sent','active':'Active','keep':'Keep on file','keep on file':'Keep on file','writers list':'Keep on file','declined':'Declined'};
function csvPeople(t){
  const rows=parseCsv(t);if(rows.length<2) return [];
  const h=rows[0].map(x=>x.trim().toLowerCase()),ix=(...k)=>h.findIndex(x=>k.some(y=>x.startsWith(y)));
  const cN=ix('full name','name'),cE=ix('email'),cC=ix('category','strong'),cY=ix('years'),cS=ix('status'),cSo=ix('source'),cNo=ix('notes'),cR=ix('role');
  if(cN<0) return [];
  return rows.slice(1).map(r=>{const g=i=>i<0?'':String(r[i]||'').trim(),raw=g(cS),st=STMAP[raw.toLowerCase()]||'New',nt=g(cNo);
    return {name:g(cN),email:g(cE),strengths:g(cC),years:g(cY),status:st,source:g(cSo),notes:[nt,raw&&!STMAP[raw.toLowerCase()]?'Status in the sheet: '+raw:raw.toLowerCase()==='writers list'?'Status in the sheet: Writers list':''].filter(Boolean).join('. '),roles:cR>=0&&g(cR)?g(cR).split(/[;/]/).map(s=>s.trim()).filter(x=>CROLES.includes(x)):['Writer']}}).filter(p=>p.name);
}

/* matcher */
const SYN={Style:'style fashion jewellery jeweller jewelry jewel beauty design couture clothing textile accessories runway',Lifestyle:'lifestyle travel food home wellness hospitality hotel dining interiors',Culture:'culture art music film museum gallery exhibition heritage history book theatre',Wealth:'wealth money finance business investing bank economy property'};
function matchPeople(text,role){
  const w=new Set((String(text||'').toLowerCase().match(/[a-z]{3,}/g)||[])),R=[];
  people().forEach(p=>{
    if(p.status==='Declined') return;let s=0;const why=[];
    const cat=(p.strengths||'').trim();
    if(cat){const syn=((SYN[cat]||'')+' '+cat.toLowerCase()).split(/\s+/);if(syn.some(x=>w.has(x))){s+=4;why.push('Strongest in '+cat)}}
    if(role&&role!=='Any'&&(p.roles||[]).includes(role)){s+=2;why.push(role)}else if(role&&role!=='Any'&&!(p.roles||[]).includes(role)) s-=3;
    const y=p.years||'';if(/>\s*5/.test(y)){s+=2;why.push('more than 5 years')}else if(/2-5/.test(y)){s+=1;why.push('2 to 5 years')}
    if(p.status==='Active'){s+=2;why.push('active')}else if(p.status==='Keep on file'){s+=1;why.push('kept on file')}else if(p.status==='Test sent'){s+=1;why.push('test sent')}
    const done=asgs().filter(a=>a.cid===p.id&&a.stage==='Published').length;if(done){s+=1;why.push(done+' published with us')}
    if(!p.email&&!p.phone){s-=1;why.push('no contact details yet')}
    R.push({p,s,why});
  });
  return R.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);
}

function dossierData(id){
  const k=get('kit',id)||null,pp=get('pipe',id)||null,item=pp||k;if(!item) return null;
  const kind=pp?'Sponsor':k.type==='partner'?'Partner':k.type==='contributor'?'Contributor':'Record';
  const name=pp?pp.group:k.name,T=[],F=[];
  const push=(d,t)=>{if(t) T.push([d||'',t])};
  if(pp){F.push(['Status',pp.status],['Owner',pp.owner||''],['Next step',(pp.next||'')+(pp.nextDate?' ('+fmt(pp.nextDate)+')':'')],['Why',pp.why||''],['Notes',pp.notes||'']);
    contactsOf(id).forEach(c=>F.push(['Contact',[c.name,c.role,c.email,c.phone].filter(Boolean).join(', ')]));
    logsOf(id).forEach(l=>push(l.date||'',(l.type||'Contact')+': '+(l.note||l.text||l.summary||'')))}
  if(k&&k.type==='partner'){F.push(['Stage',stLabel(k.stage)],['Kind',k.kind||''],['Contact',k.contact||''],['Next step',(k.next||'')+(k.nextDate?' ('+fmt(k.nextDate)+')':'')],['We give',glTxt(k,'give')],['We get',glTxt(k,'get')],['Notes',k.notes||'']);const e=ptEv(k);if(e) push(e.start,'Event: '+e.name+' ('+evDates(e)+')');(k.outcomes||[]).forEach(o=>push(o.date||'',(o.result||'Outcome')+': '+(o.text||'')))}
  if(k&&k.type==='contributor'){F.push(['Works as',(k.roles||[]).join(', ')],['Strongest in',k.strengths||''],['Experience',k.years||''],['Status',k.status],['Email',k.email||''],['Phone',k.phone||''],['From',k.source||''],['Notes',k.notes||''])}
  covOf(id).forEach(c=>push(c.date,'Published: '+c.title+' ('+c.where+')'));
  S.kit.filter(f=>f.type==='followup'&&f.pipeId===id).forEach(f=>push(f.due,(f.done?'Done: ':'Follow-up: ')+f.text));
  asgs().filter(a=>a.linkId===id||a.cid===id||(a.rounds||[]).some(r=>r.cid===id)).forEach(a=>push(a.due||'',a.title+': '+a.stage+(a.cid&&a.cid!==id?', with '+cname(a.cid):'')));
  drafts().filter(d=>d.forId===id).forEach(d=>push(d.at,d.kind+' draft: '+(d.title||'')+' ('+(DST[d.status]||d.status)+')'));
  S.activity.forEach(a=>(a.changes||[]).forEach(c=>{if(c.name===name) push((a.at||'').slice(0,10),(c.kind||'')+': '+(c.what||a.label))}));
  return {kind,name,F:F.filter(x=>x[1]&&String(x[1]).trim()),T:T.filter(x=>x[1]).sort((a,b)=>(a[0]||'')<(b[0]||'')?1:-1)};
}

function handoverData(){

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
async function remind(force){
  if(!('Notification' in window)||Notification.permission!=='granted') return false;
  const S=window.TLLJ_STATE&&window.TLLJ_STATE();if(!S||!S.tasks||!S.tasks.length) return false;
  const t=today(),open=S.tasks.filter(x=>!x.done&&x.due);
  const od=open.filter(x=>x.due<t).length,dt=open.filter(x=>x.due===t),fu=(S.kit||[]).filter(k=>k.type==='followup'&&window.fuDue&&window.fuDue(k,t)),fs=(S.kit||[]).filter(k=>k.type==='followup'&&window.fuSoon&&window.fuSoon(k,t));
  let last='';try{last=localStorage.getItem('tllj_notified')||''}catch(e){}
  if(!force&&last===t) return false;
  if(!od&&!dt.length&&!fu.length&&!fs.length&&!force) return false;
  const body=(dt.length?dt.length+' due today. ':'Nothing due today. ')+(od?od+' overdue.':'')+(dt[0]?' First: '+String(dt[0].action).slice(0,80):'')+(fu.length?' Follow-up'+(fu.length===1?'':'s')+': '+String(fu[0].text).slice(0,70)+(fu.length>1?' and '+(fu.length-1)+' more.':'.'):'')+(fs.length?' Coming up: '+String(fs[0].text).slice(0,60)+(fs.length>1?' and '+(fs.length-1)+' more.':'.'):'');
  const reg=await navigator.serviceWorker.getRegistration();
  if(reg) await reg.showNotification('TLLJ Desk',{body,icon:'icon-192.png',badge:'icon-192.png',tag:'tllj-daily'});
  try{localStorage.setItem('tllj_notified',t)}catch(e){}
  return true;
}
