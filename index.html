<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TLLJ Partnerships Desk</title>
<script>try{var t=localStorage.getItem("tllj_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#630551"><meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TLLJ Desk">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css"></head><body>
<div class="wrap">
<header>
 <div class="top"><h1>TLLJ Partnerships Desk</h1><div class="row"><div class="sub" id="sub"></div><button class="btn" id="undo" data-act="undo" disabled>Undo</button><span id="tools" class="row"><button class="btn" data-act="search">Search</button><button class="btn" id="tillybtn" data-act="tilly">Tilly</button></span><button class="btn" id="themebtn" data-act="theme" aria-label="Switch between light and dark">Dark</button><button class="btn" data-act="settings">Settings</button><button class="btn" id="signout" data-act="signout" hidden>Sign out</button></div></div>
 <nav id="nav"></nav>
</header>
<main id="main"><p class="empty">Loading the plan, pipeline and events.</p></main>
</div>
<dialog id="dlg"></dialog><dialog id="dlg2"></dialog>
<div id="toast" class="toast" hidden></div>
<script>
const END='2026-12-07', START='2026-10-27';
const STATUSES=['Not started','Finding the contact','Contact found','First message sent','In conversation','Proposal sent','Negotiating','Agreed','Declined','On hold'];
const ACTIVE=['First message sent','In conversation','Proposal sent','Negotiating','Agreed'];
const LIVE=['In conversation','Proposal sent','Negotiating'];
const COLS=['tasks','events','pipe','log','contacts','kit','prep','deals','decisions','activity','evsug','notes'];
const S={loaded:{},tab:'today',fo:'All',fw:'All',fs:'All',fc:'Missing',ai:{}};
COLS.forEach(c=>S[c]=[]);
let db=null,sample=null,EDIT=true,CONTRIB=false;
const CACTS=new Set(['search','gosearch','edit','new','newsp','editfull','quickc','addcontact','addlog']);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const dd=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?pd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'No date';
const rel=s=>{const n=dd(TODAY,s);return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n<0?(-n)+' days overdue':'in '+n+' days'};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dOK=v=>/^\d{4}-\d\d-\d\d$/.test(v||'');
const get=(c,id)=>S[c].find(x=>x.id===id);
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800)}

/* ---------- data layer with undo ---------- */
let cur=null;const hist=[];
function rec(col,id){if(cur){const p=get(col,id);cur.push({col,id,prev:p?{...p}:null})}}
function renderUndo(){const b=$('#undo');if(!b) return;const h=hist[hist.length-1];b.hidden=!EDIT;b.disabled=!h;b.textContent=h?'Undo: '+h.label:'Undo';b.title='Undo the last change (Ctrl+Z)'}
async function act(label,fn){cur=[];let items=[];try{await fn()}finally{items=cur||[];if(items.length){hist.push({label,items});if(hist.length>30)hist.shift()}cur=null;renderUndo();if(items.length) recordActivity(label,items)}}
function local(col,id,d){const i=S[col].findIndex(x=>x.id===id);if(d==null){if(i>=0) S[col].splice(i,1)}else if(i<0) S[col].push({...d});else S[col][i]={...d}}
async function undo(){const b=hist.pop();renderUndo();if(!b){toast('Nothing to undo');return}
  try{for(const it of b.items.slice().reverse()){const r=db.collection(it.col).doc(it.id);if(it.prev){await r.set(it.prev);local(it.col,it.id,it.prev)}else{await r.delete();local(it.col,it.id,null)}}toast('Undid: '+b.label);recordActivity('Undid: '+b.label,[]);if(!$('#dlg').open) render()}catch(e){toast('Could not undo: '+(e.message||''))}}
async function save(col,id,data){
  if(!db){toast('Saving is not available in this view.');return false}
  rec(col,id);
  try{await db.collection(col).doc(id).set({...data,id});local(col,id,{...data,id});return true}catch(e){toast('Not saved: '+(e.message||'check edit access'));return false}
}
async function patch(col,id,p){const c=get(col,id)||{};return save(col,id,{...c,...p})}
async function remove(col,id){rec(col,id);try{await db.collection(col).doc(id).delete();local(col,id,null)}catch(e){toast('Not deleted: '+(e.message||''))}}

/* ---------- facts ---------- */
const open=()=>S.tasks.filter(t=>!t.done);
const byDue=(a,b)=>(a.due||'9')<(b.due||'9')?-1:1;
const logsOf=id=>S.log.filter(l=>l.pipeId===id).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
const contactsOf=id=>S.contacts.filter(c=>c.pipeId===id);
const hasContact=id=>contactsOf(id).some(c=>c.email||c.phone);
function lastOf(id,types){const l=logsOf(id).find(x=>types.includes(x.type));return l?l.date:null}
const conflictFor=p=>p.category?S.pipe.filter(q=>q.id!==p.id&&q.category===p.category&&ACTIVE.includes(q.status)):[];
function conflicts(){const m={};S.pipe.filter(p=>p.category&&ACTIVE.includes(p.status)).forEach(p=>(m[p.category]=m[p.category]||[]).push(p));return Object.entries(m).filter(([,a])=>a.length>1)}
function stdPrep(e){
  const f=addDays(e.end,2);
  return [
   ['Before',`Confirm access: ${e.status||'status not recorded'}`],['Before',`Decide who goes (now: ${e.who||'To decide'}) and which day`],
   ['Before',`Choose the people to meet from: ${(e.reach||'no names recorded').slice(0,160)}`],['Before','Write three questions for each person on the meeting list'],
   ['Before','Pack the one-line description, the reach figures Fatimah has approved and one sample feature link'],
   ['During','Collect passes or register on arrival'],['During','Meet the people on the list and ask the questions'],['During','Log every conversation in the sponsor\'s outreach log the same day'],
   ['After',`Send follow-up emails by ${fmt(f)} (within 48 hours of the end)`],['After','Log replies and update each sponsor\'s next step'],['After','Add coverage and photos to the editorial plan']
  ].map(([phase,text])=>({phase,text}));
}
function sug(){
  const out=[];const add=(text,why,due,pid)=>{if(!S.tasks.some(t=>!t.done&&t.action===text)&&!out.some(o=>o.text===text)) out.push({text,why,due:due||TODAY,pid})};
  for(const p of S.pipe){
    if(['Declined','On hold','Agreed'].includes(p.status)) continue;
    const out_=lastOf(p.id,['Email sent']),in_=lastOf(p.id,['Email received','Call','Meeting']);
    if(out_&&(!in_||in_<out_)){const n=dd(out_,TODAY);if(n>=7) add(`Chase ${p.group}: no reply in ${n} days`,`Last email sent ${fmt(out_)}. Nothing received since.`,TODAY,p.id)}
    if(p.status==='In conversation'&&in_&&dd(in_,TODAY)>=3&&(!out_||out_<=in_)) add(`Reply to ${p.group} or send the proposal`,`They last responded ${fmt(in_)}. No email from us since.`,TODAY,p.id);
    if(p.status==='Not started'&&p.when==='Start now'&&!hasContact(p.id)) add(`Find a contact route for ${p.group}`,'First wave, with no email or phone entered yet.',addDays(TODAY,1),p.id);
    if(p.status==='Contact found') add(`Send the first email to ${p.group}`,'A contact is entered and no message has gone.',TODAY,p.id);
    if(p.nextDate&&p.nextDate<TODAY) add(`Do the overdue step for ${p.group}: ${p.next}`.slice(0,200),`Due ${fmt(p.nextDate)}.`,TODAY,p.id);
  }
  for(const e of S.events){
    const n=dd(TODAY,e.start),pr=S.prep.filter(x=>x.eventId===e.id);
    if(n>=0&&n<=3&&(!pr.length||pr.some(x=>x.phase==='Before'&&!x.done))) add(`Finish prep for ${e.name}`,`Starts ${rel(e.start)}${pr.length?'':'. No checklist yet.'}`,TODAY);
    if(e.end<=TODAY&&dd(e.end,TODAY)<=2&&pr.some(x=>x.phase==='After'&&!x.done)) add(`Send follow-up emails after ${e.name}`,`Due by ${fmt(addDays(e.end,2))}.`,addDays(e.end,2));
  }
  for(const d of S.deals){const p=get('pipe',d.pipeId);if(!p) continue;
    if(dOK(d.publishDate)&&d.publishDate<=TODAY&&d.invoice==='Not invoiced') add(`Invoice ${p.group}`,`Published ${fmt(d.publishDate)}. No invoice recorded.`,TODAY,p.id);
    if(dOK(d.renewal)&&dd(TODAY,d.renewal)<=30&&dd(TODAY,d.renewal)>=0) add(`Open the renewal conversation with ${p.group}`,`Renewal ${fmt(d.renewal)}.`,TODAY,p.id)}
  const signed=S.pipe.some(p=>p.status==='Agreed'),pend=S.pipe.some(p=>['Proposal sent','Negotiating'].includes(p.status));
  if(!signed&&!pend&&dd(TODAY,END)<=21){const fb=(get('kit','fallbacks')||{items:[]}).items.map(f=>S.pipe.find(p=>p.group===f.group)).find(p=>p&&!ACTIVE.includes(p.status));if(fb) add(`Send the proposal to ${fb.group}`,`No proposal is out and ${dd(TODAY,END)} days remain. ${fb.group} is a named cash fallback.`,TODAY,fb.id)}
  return out;
}

/* ---------- list pieces ---------- */
function taskItem(t){
  const late=!t.done&&t.due&&t.due<TODAY;
  return `<div class="item"><input type="checkbox" data-act="tick" data-id="${t.id}" ${t.done?'checked':''} ${EDIT?'':'disabled'} aria-label="Done"><div><div class="t" data-act="edit" data-col="tasks" data-id="${t.id}">${esc(t.action)}</div><div class="meta"><span class="pill ${late?'warn':''}">${esc(fmt(t.due))}${t.due&&!t.done?' · '+rel(t.due):''}</span><span>${esc(t.owner)}</span><span>${esc(t.target)}</span></div></div></div>`;
}
function pipeItem(p){
  const late=p.nextDate&&p.nextDate<TODAY;
  return `<div class="item"><span></span><div><div class="t" data-act="edit" data-col="pipe" data-id="${p.id}"><b>${esc(p.group)}</b>: ${esc(p.next)}</div><div class="meta"><span class="pill ${late?'warn':'gold'}">${esc(fmt(p.nextDate))}${p.nextDate?' · '+rel(p.nextDate):''}</span><span>${esc(p.owner)}</span><span>${esc(p.status)}</span></div></div></div>`;
}
function evRow(e){
  const live=e.start<=TODAY&&e.end>=TODAY,pr=S.prep.filter(x=>x.eventId===e.id),dn=pr.filter(x=>x.done).length;
  return `<div class="ev" data-act="edit" data-col="events" data-id="${e.id}"><b>${esc(e.name)}</b><div class="meta"><span class="pill ${live?'ok':''}">${live?'On now':fmt(e.start)+' · '+rel(e.start)}</span><span>${esc(fmt(e.start))} to ${esc(fmt(e.end))}</span><span>${esc(e.where)}</span></div><div class="meta">${esc(e.status||'')}</div>${EDIT?`<div class="meta"><button class="btn sm" data-act="prepopen" data-id="${e.id}">Prep ${pr.length?dn+'/'+pr.length:''}</button></div>`:''}</div>`;
}
function sugItem(s,i,k){
  return `<div class="item"><span></span><div><b>${esc(s.text)}</b><div class="meta"><span>${esc(s.why||'')}</span></div><div class="meta"><span class="pill gold">${esc(fmt(s.due))}</span>${EDIT?`<button class="btn sm" data-act="addsug" data-k="${k}" data-id="${i}">Add to plan</button>`:''}${s.pid&&EDIT?`<button class="btn sm" data-act="edit" data-col="pipe" data-id="${s.pid}">Open sponsor</button>`:''}</div></div></div>`;
}

/* ---------- views ---------- */
function vToday0(){
  const t=open().sort(byDue);
  const overdue=t.filter(x=>x.due&&x.due<TODAY),todayT=t.filter(x=>x.due===TODAY);
  const week=t.filter(x=>x.due&&x.due>TODAY&&dd(TODAY,x.due)<=7);
  const pOpen=S.pipe.filter(p=>p.nextDate&&!['Agreed','Declined','On hold'].includes(p.status)).sort((a,b)=>a.nextDate<b.nextDate?-1:1);
  const pDue=pOpen.filter(p=>p.nextDate<=TODAY),pWeek=pOpen.filter(p=>p.nextDate>TODAY&&dd(TODAY,p.nextDate)<=7);
  const evs=S.events.filter(e=>e.end>=TODAY&&dd(TODAY,e.start)<=21).sort((a,b)=>a.start<b.start?-1:1);
  const opp=S.pipe.filter(p=>p.status==='Not started'&&p.when==='Start now').sort((a,b)=>b.score-a.score).slice(0,5);
  const late=overdue.length+pDue.filter(p=>p.nextDate<TODAY).length;
  const live=S.pipe.filter(p=>LIVE.includes(p.status)).length,signed=S.pipe.filter(p=>p.status==='Agreed').length;
  const sg=sug(),L=(a,f,m)=>a.length?a.map(f).join(''):`<div class="empty">${m}</div>`;
  const ask=S.ai.sugg||[];
  const pend=S.decisions.filter(d=>!d.answer).length;
  return `${late?`<div class="banner" role="status">${late} overdue. Clear these first.</div>`:''}
  <div class="stats">
   <div class="stat"><b>${Math.max(0,dd(TODAY,END))}</b><span>days to 7 Dec</span></div>
   <div class="stat ${late?'bad':''}"><b>${late}</b><span>overdue</span></div>
   <div class="stat"><b>${todayT.length+pDue.filter(p=>p.nextDate===TODAY).length}</b><span>due today</span></div>
   <div class="stat"><b>${live}</b><span>live conversations</span></div>
   <div class="stat ${signed?'good':''}"><b>${signed}</b><span>signed</span></div>
   ${pend?`<div class="stat"><b>${pend}</b><span>decisions open</span></div>`:''}
  </div>
  <div class="cols"><div>
   <section class="box"><h2>Suggested next steps <small>from the log, contacts, events and deals</small></h2>${L(sg,(s,i)=>sugItem(s,i,'local'),'Nothing extra suggested. The plan covers today.')}${ask.length?`<div class="meta" style="margin-top:8px"><b>Suggested for you</b></div>`+ask.map((s,i)=>sugItem(s,i,'ai')).join(''):''}${EDIT?`<div class="row" style="margin-top:8px"><button class="btn" data-act="aisugg">Ask Tilly for more</button></div>`:''}</section>
   <section class="box"><h2>Due now <small>${fmt(TODAY)}</small></h2>${L([...overdue,...todayT],taskItem,'Nothing overdue or due today.')}${pDue.map(pipeItem).join('')}</section>
   <section class="box"><h2>Next 7 days</h2>${L(week,taskItem,'No plan steps in the next 7 days.')}${pWeek.map(pipeItem).join('')}</section>
  </div><div>
   <section class="box"><h2>Events <small>next 3 weeks</small></h2>${L(evs,evRow,'No events in the next 3 weeks.')}</section>
   <section class="box"><h2>Opportunities <small>start now, by score</small></h2>${L(opp,p=>`<div class="ev" data-act="edit" data-col="pipe" data-id="${p.id}"><b>${esc(p.group)}</b><div class="meta"><span class="pill">Score ${esc(p.score)}</span><span>${esc(p.chance)}</span><span>${esc(p.owner)}</span></div><div class="meta">${esc(p.propose)}</div></div>`,'No unstarted groups marked Start now.')}</section>
  </div></div>`;
}

function vRoadmap(){
  const days=[...Array(42)].map((_,i)=>addDays(START,i));
  const col=s=>Math.min(42,Math.max(1,dd(START,s)+1));
  const weeks=[...new Set(S.tasks.map(t=>t.week))];
  const tl=dd(START,TODAY);
  const head=`<div class="rmh"><div></div>${[0,1,2,3,4,5].map(i=>`<div class="wk">Week ${i+1} · ${fmt(days[i*7]).replace(/^\w+ /,'')}</div>`).join('')}</div><div class="rmh"><div></div>${days.map(d=>`<div>${pd(d).getDate()}</div>`).join('')}</div>`;
  const evRows=S.events.slice().sort((a,b)=>a.start<b.start?-1:1).map(e=>`<div class="rmr"><div class="lab">${esc(e.name)}</div><div class="cell"><button class="bar" data-act="edit" data-col="events" data-id="${e.id}" style="grid-column:${col(e.start)}/${Math.min(42,col(e.end))+1}" title="${esc(e.name)}">${esc(e.name)}</button></div></div>`).join('');
  const wkRows=weeks.map(w=>{const ts=S.tasks.filter(t=>t.week===w);return `<div class="rmr"><div class="lab"><b>${esc(w)}</b></div><div class="cell">${ts.filter(t=>t.due).map(t=>`<button class="dot ${t.done?'done':t.due<TODAY?'late':''}" style="grid-column:${col(t.due)}" data-act="edit" data-col="tasks" data-id="${t.id}" title="${esc(fmt(t.due))}: ${esc(t.action)}" aria-label="${esc(t.action)}"></button>`).join('')}</div></div>`}).join('');
  const pRow=`<div class="rmr"><div class="lab"><b>Sponsor next steps</b></div><div class="cell">${days.map(d=>{const n=S.pipe.filter(p=>p.nextDate===d&&!['Agreed','Declined'].includes(p.status)).length;return n?`<span class="pill gold" style="grid-column:${col(d)};justify-self:center" title="${n} next steps on ${esc(fmt(d))}">${n}</span>`:''}).join('')}</div></div>`;
  const line=tl>=0&&tl<42?`<div class="today-line" style="left:calc(150px + (100% - 150px) * ${(tl+.5)/42})"></div>`:'';
  const lists=weeks.map(w=>{const ts=S.tasks.filter(t=>t.week===w).sort(byDue),n=ts.filter(t=>t.done).length,g=ts[0]||{};return `<section class="box week"><h3>${esc(w)} <small style="font:400 13px var(--sans);color:var(--mute)">${esc(g.dates)}</small></h3><div class="meta">${esc(g.goal)} · ${n} of ${ts.length} done</div><div class="prog"><i style="width:${ts.length?100*n/ts.length:0}%"></i></div>${ts.map(taskItem).join('')}</section>`}).join('');
  return `<div class="legend"><span><i></i>Plan step due</span><span><i style="background:var(--ok);border-color:var(--ok)"></i>Done</span><span><i style="border-color:var(--warn);background:var(--warn-soft)"></i>Overdue</span><span><span class="pill" style="background:var(--accent);color:var(--accent-ink)">Bar</span> Event</span></div>
  <div class="rm"><div class="rmi">${head}${evRows}${wkRows}${pRow}${line}</div></div>
  <div class="row" style="margin:14px 0"><button class="btn pri" data-act="new" data-col="tasks">Add plan step</button><button class="btn" data-act="new" data-col="events">Add event</button></div>${lists}`;
}

function vPipeline(){
  const owners=['All','Sade','Fatimah','Both'];
  const p=S.pipe.filter(x=>(S.fo==='All'||x.owner===S.fo)&&(S.fw==='All'||x.when===S.fw));
  const whens=['All',...new Set(S.pipe.map(x=>x.when))];
  const lanes=STATUSES.filter(s=>S.fs==='All'||s===S.fs).map(s=>{
    const c=p.filter(x=>x.status===s).sort((a,b)=>b.score-a.score);
    return `<div class="lane"><h3>${esc(s)} <span class="pill">${c.length}</span></h3>${c.map(x=>{const cf=conflictFor(x).length&&ACTIVE.includes(x.status);return `<div class="card" data-act="edit" data-col="pipe" data-id="${x.id}"><b>${esc(x.group)}</b><div class="meta"><span>Score ${esc(x.score)}</span><span>${esc(x.owner)}</span><span>${esc(x.category||x.tab)}</span>${cf?'<span class="pill warn">Same category active</span>':''}</div>${x.next?`<div class="meta">${x.nextDate?esc(fmt(x.nextDate))+': ':''}${esc(x.next.slice(0,110))}${x.next.length>110?'…':''}</div>`:''}</div>`}).join('')||'<div class="empty">None</div>'}</div>`}).join('');
  const opt=(a,v)=>a.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');
  return `<div class="filters"><select id="fo" aria-label="Owner">${opt(owners,S.fo)}</select><select id="fw" aria-label="When to approach">${opt(whens,S.fw)}</select><select id="fs" aria-label="Status">${opt(['All',...STATUSES],S.fs)}</select><button class="btn pri" data-act="new" data-col="pipe">Add sponsor</button></div><div class="board">${lanes}</div>`;
}

function vContacts(){
  let list=S.pipe.slice().sort((a,b)=>b.score-a.score);
  const miss=list.filter(p=>!hasContact(p.id));
  if(S.fc==='Missing') list=miss;
  return `<div class="filters"><select id="fc" aria-label="Show"><option ${S.fc==='Missing'?'selected':''}>Missing</option><option ${S.fc==='All'?'selected':''}>All</option></select><span class="meta" style="align-self:center">${miss.length} of ${S.pipe.length} sponsors have no email or phone yet. Adding one moves the sponsor to Contact found and sets the next step to send the first email.</span></div>
  <section class="box">${list.map(p=>{const cs=contactsOf(p.id);return `<div class="sec" style="margin-top:0;border-top:1px solid var(--line)"><div class="row" style="justify-content:space-between"><b data-act="edit" data-col="pipe" data-id="${p.id}" style="cursor:pointer">${esc(p.group)}</b><span class="pill ${hasContact(p.id)?'ok':'warn'}">${hasContact(p.id)?'Contact entered':'Contact needed'}</span></div>
  ${cs.map(c=>`<div class="item" style="padding:4px 0"><div><b>${esc(c.name||'Unnamed')}</b>${c.role?` <span class="meta">${esc(c.role)}</span>`:''}<div class="meta">${esc([c.email,c.phone].filter(Boolean).join(' · '))}</div>${c.route?`<div class="meta">${esc(c.route)}</div>`:''}</div>${EDIT||CONTRIB?`<button class="btn sm" data-act="edit" data-col="contacts" data-id="${c.id}">Edit</button>`:''}</div>`).join('')||'<div class="meta">Nothing entered yet.</div>'}
  <label class="meta">Write to first / how to reach them</label>
  <textarea data-cell="pipe" data-id="${p.id}" data-k="first" style="min-height:44px" placeholder="Who to approach and how, for example an introduction through a friend" aria-label="Write to first" ${EDIT||CONTRIB?'':'disabled'}>${esc(p.first||'')}</textarea>

function vScore(){

  const mx=Math.max(1,...STATUSES.map(s=>by(s).length));

  const cf=conflicts();
  const left=dd(TODAY,END);

function openEdit(col,id,full){

    if(col==='decisions'){o.n=Number(o.n)||0;if(isNew){Object.assign(o,{answer:'',comment:''})}}

}

async function advanceOnContact(pid,c){

async function advanceOnLog(pid,l){

async function aiText(prompt,onText,opts){if(!sample){toast('Tilly is not available in this view.');throw new Error('none')}const r=await sample(prompt,{cache:false,onText:u=>onText&&onText(u.text),...(opts||{})});return r.text}

async function brief(){const out=$('#brief');out.textContent='Reading the desk…';try{S.ai.brief=await aiText(STYLE+'\nWrite a brief for today in at most 170 words: the three most important actions in order, what is overdue, what to chase from the outreach log, and the next event to prepare for. Plain text, short lines starting with a dash.\nDATA: '+ctx(),t=>out.textContent=t);out.textContent=S.ai.brief}catch(e){out.textContent='Tilly could not answer: '+(e.message||e.code)}}

  try{S.ai.weekly=await aiText(STYLE+`\nWrite a short WhatsApp-style update from Sade to Fatimah. Warm, conversational, a natural Nigerian register, never stiff. Rules: no "Done" section and nothing presented as done unless it is in movedThisWeek; one sentence on what moved and one on what is stuck; then "Today" as plain bullet points of tasks Sade still has to do; then ONE short merged section for questions, views needed and reminders for Fatimah (use decisionsOpen and any pending approvals). Keep it under 170 words. No sign-off block.\nDATA: ${ctx()}\nmovedThisWeek: ${JSON.stringify(moved)}`,t=>box.value=t);box.value=S.ai.weekly}catch(e){box.value='Tilly could not write the update: '+(e.message||e.code)}}

const apply=()=>act('Tilly updates',applyInner);
async function applyInner(){
  const r=S.ai.prop;if(!r) return;let n=0;
  for(const x of r.contacts||[]){if(get('pipe',x.pipeId)&&(x.name||x.email||x.phone)&&await addContact(x.pipeId,x)) n++}
  for(const x of r.log||[]){if(get('pipe',x.pipeId)&&await addLog(x.pipeId,x)) n++}
  for(const x of r.pipe||[]){const p=get('pipe',x.id);if(!p) continue;const u={};
    if(x.status&&STATUSES.includes(x.status)) u.status=x.status;if(x.next) u.next=x.next;if(dOK(x.nextDate)) u.nextDate=x.nextDate;
    if(x.notes) u.notes=((p.notes?p.notes+' ':'')+x.notes).trim();
    if(Object.keys(u).length&&await patch('pipe',p.id,u)){n++;if(u.status==='Agreed'&&!S.deals.some(d=>d.pipeId===p.id)) await newDeal(p.id)}}
  for(const x of r.steps||[]){if(!get('tasks',x.id)) continue;const u={};if(typeof x.done==='boolean') u.done=x.done;if(dOK(x.due)) u.due=x.due;if(x.action) u.action=x.action;if(Object.keys(u).length&&await patch('tasks',x.id,u)) n++}
  for(const x of r.newSteps||[]){if(await save('tasks',uid('t'),{week:'Added',dates:'',goal:'',action:x.action,target:'',owner:['Sade','Fatimah','Both'].includes(x.owner)?x.owner:'Sade',done:false,due:dOK(x.due)?x.due:null})) n++}
  for(const x of r.events||[]){const ex=get('events',x.id);
    if(x.remove){if(ex){await remove('events',ex.id);n++}continue}
    const u={};['name','where','status','note'].forEach(k=>{if(x[k]) u[k]=x[k]});if(dOK(x.start)) u.start=x.start;if(dOK(x.end)) u.end=x.end;
    if(ex){if(Object.keys(u).length&&await patch('events',ex.id,u)) n++}
    else if(u.name&&u.start){if(await save('events',uid('e'),{end:u.start,who:'To decide',reach:'',how:'',...u})) n++}}
  for(const x of r.deals||[]){if(!get('pipe',x.pipeId)) continue;const ex=S.deals.find(d=>d.pipeId===x.pipeId);const u={};['deliverables','amount'].forEach(k=>{if(x[k]) u[k]=x[k]});if(['Not invoiced','Invoiced','Paid'].includes(x.invoice)) u.invoice=x.invoice;if(dOK(x.publishDate)) u.publishDate=x.publishDate;if(dOK(x.renewal)) u.renewal=x.renewal;
    if(!Object.keys(u).length) continue;if(ex){if(await patch('deals',ex.id,u)) n++}else if(await save('deals',uid('dl'),{pipeId:x.pipeId,deliverables:'',publishDate:null,amount:'',invoice:'Not invoiced',renewal:null,notes:'',...u})) n++}
  S.ai.prop=null;for(const q of ['#props','#dprops']){const bx=$(q);if(bx) bx.textContent=''}toast(n+' updates applied');
}

  if(!EDIT&&!(CONTRIB&&CACTS.has(a))) return;

    await guard('events',null,ev,'Add event: '+x.name.slice(0,24),async()=>{await save('events',ev.id,ev);await dbSet('evsug',{...x,status:'added'})});render();return}
  if(a==='findc'){findContacts(id);return}
  if(a==='findc2'){openSponsor(id);findContacts(id);return}

function ripple(col,old,nw,del){

      w(`Removing ${P.group} also removes ${nc} contact${nc===1?'':'s'}, ${nl} log entr${nl===1?'y':'ies'}${nd?' and its deal tracker':''}. Undo brings them all back.`);
      if(ACTIVE.includes(P.status)) w(`${P.group} is ${P.status.toLowerCase()}. Removing it lowers the live count.`);
      const st=S.tasks.filter(x=>!x.done&&x.target===P.group);if(st.length) t(`${st.length} open plan step${st.length===1?'':'s'} point to this sponsor and will keep its name.`);
      return W}

      else if(ACTIVE.includes(nw.status)&&!ACTIVE.includes(old.status)&&same.length) same.forEach(q=>w(`${q.group} in the same category is already ${q.status.toLowerCase()}. Offer a different slot.`));
      if(['Declined','On hold'].includes(nw.status)&&ACTIVE.includes(old.status)){
        const left=S.pipe.filter(p=>p.id!==nw.id&&ACTIVE.includes(p.status)).length;
        if(left===0){const nb=S.pipe.filter(p=>p.id!==nw.id&&p.status==='Not started').sort((a,b)=>b.score-a.score)[0];
          w('No other sponsor is active, and the target needs one by 7 December.',nb?{label:`Start ${nb.group} (next best, score ${nb.score})`,col:'pipe',id:nb.id,patch:{status:'Finding the contact',nextDate:addDays(TODAY,1),next:'Find the contact route and send the first message.'}}:null)}
        if(nw.nextDate) t('This sponsor still has a next-step date. Clear it so it stops showing on Today.',{label:'Clear its next step',col:'pipe',id:nw.id,patch:{nextDate:null,next:''}})}
    }

const shortV=v=>{v=v==null||v===''?'blank':String(v);return v.length>48?v.slice(0,48)+'…':v};

function diffOf(col,prev,now){
  if(!prev&&now) return 'added';if(prev&&!now) return 'removed';
  const skip=new Set(['id','checks','n','rows','items','body']);const out=[];
  Object.keys(now).forEach(k=>{if(skip.has(k)||JSON.stringify(prev[k])===JSON.stringify(now[k])) return;out.push(k+': '+shortV(prev[k])+' → '+shortV(now[k]))});

        main.innerHTML='<section class="box"><h2>Sign in</h2><p class="meta">Use the Google account that was given access.</p><button class="btn pri" id="login">Sign in with Google</button></section>';
        const note=t=>{let n=document.getElementById('lerr');if(!n){n=document.createElement('p');n.id='lerr';n.className='meta';document.getElementById('login').after(n)}n.textContent=t};
        document.getElementById('login').onclick=()=>{note('');Au.signInWithPopup(auth,new Au.GoogleAuthProvider()).catch(e=>{const c=e.code||'';note('Sign-in stopped ('+c+'). '+(c==='auth/unauthorized-domain'?'Add '+location.hostname+' under Authentication, Settings, Authorized domains.':c==='auth/operation-not-allowed'?'Turn on the Google provider under Authentication, Sign-in method.':c==='auth/popup-blocked'?'Allow pop-ups for this site and try again.':c==='auth/api-key-not-valid.-please-pass-a-valid-api-key.'||c==='auth/invalid-api-key'?'The apiKey in firebase-config.js is wrong.':(e.message||'')))})};
        return;
      }
      const email=(user.email||'').toLowerCase(),edit=lower(C.editors).includes(email),contrib=!lower(C.editors).includes(email)&&lower(C.contributors).includes(email),view=lower(C.viewers).includes(email);
      if(!edit&&!contrib&&!view){
        main.innerHTML='<section class="box"><h2>No access</h2><p class="meta">'+email+' has not been given access. Ask Sade to add it.</p><button class="btn" id="out">Sign out</button></section>';
        document.getElementById('out').onclick=()=>window.signOutApp();return;
      }
      started=true;
      window.TLLJ_USER=email;window.startApp({db:fdb,sample:makeSample(),edit,contrib,auth:true});
    });
  }catch(e){
    main.innerHTML='<section class="box"><h2>Could not start</h2><p class="meta">'+String(e.message||e)+'</p></section>';
  }
}
</script>
</body></html>
