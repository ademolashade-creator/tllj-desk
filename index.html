function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;

  for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,f.data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+sz}
  const cdLen=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),0,0]);
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const APPGUIDE='TLLJ Partnerships Desk. Today starts with your next moves. Follow-ups have one-tap Sent, Replied and No reply buttons. Press / to search everything. Review has a Pitch pack and a Coverage report you can save as PDF. Answered decisions can be archived. The Coverage tab logs published pieces with their links; a partner or sponsor can be moved to the other mode from its own window. A toggle above the tabs switches between Sponsorships and Partnerships. Partnerships mode has Today, Review, Partners (what we give and what we get, five stages: idea, approached, terms agreed, delivering, wrapped up; each partner can link to an event with accreditation and who attends), Events, Templates (a media-partner offer and a collaboration proposal, filled from the partner), Wrap-ups (what each side delivered and what it was worth to TLLJ) and Activity. Press invitations, media partnerships and collaborations are all partnerships. Partners also has Paste an email (Tilly fills in the partner from an email). Review has a Meeting view for Fatimah (what moved, what is stuck, decisions needed) and a Weekly view with sponsors and partners side by side, plus Copy as text and a Calendar file of next-step dates. Tabs: Today (what is due, suggested next steps); Roadmap (calendar of plan steps, events and sponsor next steps; it grows past six weeks when later items are added; Add plan step puts a step in any week); Sponsors (all sponsors under Nigeria, Africa, Global, every cell editable, warnings when a change affects other items); Pipeline (sponsors by stage; open one for contacts, outreach log, drafts, proposal checklist, deal); Contacts (each sponsor contacts and who to write to first; click a contact to edit; adding an email or phone moves the sponsor to Contact found); Events; Proposal Kit (create a proposal in one click from a sponsor, template, ticked rate-card items, audience and terms; rate card; how the prices are built; audience, terms, sponsorship ideas, templates); Balance (checks workload, dates and sponsor conflicts); Decisions (Fatimah approves or comments; Sade edits wording in place; the tab turns red for Fatimah when a decision waits); Review; Activity, with three views: Activity (sponsor activity figures, outside-the-app notes checked by Tilly, check-out report, Excel and CSV export), Scoreboard (signed, pending, live counts, fallbacks, conflicts, the editable Target with deadline and countdown, Start the next target, weekly note for Fatimah) and Deals. The Sponsors tab opens with Sponsoring focus: a sponsor in focus with its research questions (30 by default, editable, hideable, with a short list); when all are answered, Generate proposal opens the Proposal Kit on that sponsor. Top bar icons: Search, Tilly (update the board, search the web, or ask a question), Ask Tilly (a page: brief, propose updates from pasted text, ask anything, Test Tilly), Documents, Undo, Approvals (highlighted), a moon or sun toggle for dark and light, and a three-dot menu with Suggestions (notes about the desk), Export, Settings (Gemini key and model) and Sign out. Contributors mode groups people by type. On Fridays the desk opens the Friday summary for Fatimah by itself; nothing is sent until the editor presses Email Fatimah. Fatimah can use Ask Tilly for questions and draft research for the editor to approve, with her own key. Roles: editor (Sade) edits everything; contributor (Fatimah) can add and edit sponsors, contacts, events, and answer decisions; viewer reads and comments. Undo reverses the last change.';

le is Ask Tilly, which briefs you and answers questions; the page icon opens Documents. The moon or sun beside the title switches dark and light. The three dots hold Suggestions (where Fatimah and Sade leave notes about the desk), Export, Settings and Sign out.</li></ol><p class="meta">Changes that affect other items warn you first, and Undo reverses the last change.</p>

async function ptClick(a,id,el){

  if(a==='openpt'){openPartner(id);return true}
  if(a==='gopt'){openPartner(id);return true}

  if(a==='pkadd'){const x=get('kit',id),s=el.dataset.s;if(!x) return true;await act('Add package',()=>patch('kit',id,{pkgs:[...(x.pkgs||[]),{id:uid('pk'),side:s,item:'',detail:'',due:'',done:false}]}));openPartner(id);const L=document.querySelectorAll('[data-pkk=item]');const l=[...L].reverse().find(i=>!i.value);if(l) l.focus();return true}

  if(a==='ptnew'){const nid=uid('pt');await act('Add partner',()=>save('kit',nid,{type:'partner',name:'New partner',kind:'Collaboration',stage:'idea',pkgs:[],ask:'',eventId:'',accred:'Not needed',attendees:'',contact:'',next:'',nextDate:'',notes:'',wrap:{},outcomes:[],created:TODAY}));openPartner(nid);const n=document.querySelector('[data-pt="name"]');if(n){n.focus();n.select()}return true}

  if(a==='ptdraft'){S.tp={id,tpl:'media'};S.ptOut=null;S.tab='templates';$('#dlg').close();return true}
  if(a==='ptdel'){const x=get('kit',id);if(!x) return true;await act('Delete partner '+x.name,async()=>{for(const f of FUS().filter(f=>f.pipeId===id)) await remove('kit',f.id);await remove('kit',id)});$('#dlg').close();toast('Deleted. Undo brings it back.');return true}
  if(a==='ptgen'){const sel=$('#ptsel'),r=document.querySelector('input[name="pttpl"]:checked'),p=sel&&get('kit',sel.value);if(!p) return true;const g=genPT(p,r?r.value:'media');S.tp={id:p.id,tpl:r?r.value:'media'};S.ptOut={id:p.id,tpl:S.tp.tpl,text:g.text,miss:g.miss};render();return true}

  return false;
}

function composeUrl(m,route){
  const q=encodeURIComponent;
  if(route==='mailto') return 'mailto:'+(m.to||'')+'?subject='+q(m.subject||'')+'&body='+q(m.text||'')+(m.cc?'&cc='+q(m.cc):'');
  return 'https://mail.google.com/mail/?view=cm&fs=1&to='+q(m.to||'')+(m.cc?'&cc='+q(m.cc):'')+'&su='+q(m.subject||'')+'&body='+q(m.text||'');
}
async function sendMail(m){
  const c=MC();
  if(c.route==='script'&&c.url&&c.sec){
    try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:c.sec,action:'send',to:m.to,cc:m.cc||'',subject:m.subject,text:m.text,html:m.html||''})});const j=await r.json();if(j.ok){toast('Sent to '+m.to+'.');return true}toast('Not sent: '+(j.error||'the mailer refused the request'));return false}
    catch(e){toast('Could not reach the mailer. Opening Gmail instead.');window.open(composeUrl(m,'gmail'),'_blank','noopener');return false}
  }
  if(c.route==='zoho'&&c.zoho){
    try{await fetch(c.zoho,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({to:m.to,cc:m.cc||'',subject:m.subject,text:m.text,html:m.html||''})});toast('Passed to Zoho Flow for '+m.to+'. Check Zoho to confirm it went.');return true}
    catch(e){toast('Could not reach Zoho Flow.');return false}
  }
  if(c.route==='mailto'){location.href=composeUrl(m,'mailto');return true}
  window.open(composeUrl(m,'gmail'),'_blank','noopener');return true;
}
const deskLink=id=>location.origin+location.pathname+(id?'#appr='+id:'');
async function apprMail(d){
  const c=MC(),links={};
  if(c.url&&c.sec){for(const r of ['approved','changes','declined']) links[r]=c.url+'?a=r&id='+encodeURIComponent(d.id)+'&r='+r+'&t='+await tok(d.id,r)}
  const head='For your approval: '+(d.title||d.kind),body=d.body||'';
  const text='Hi Fatimah,\n\nSade has '+an(d.kind)+' ready for you.\n\n'+(d.to?'To: '+d.to+'\n':'')+(d.subject?'Subject: '+d.subject+'\n':'')+'\n'+body+'\n\n'+(links.approved?'Approve: '+links.approved+'\nAsk for changes: '+links.changes+'\nDecline: '+links.declined+'\n\n':'')+'Open it in the desk: '+deskLink(d.id)+'\n\nThank you.';
  const btn=(u,l,bg)=>`<a href="${u}" style="display:inline-block;padding:10px 18px;margin:0 8px 8px 0;border-radius:99px;background:${bg};color:#fff;text-decoration:none;font-family:Arial,sans-serif;font-size:14px">${l}</a>`;
  const html=`<div style="font-family:Arial,sans-serif;font-size:14px;color:#222;max-width:620px"><p>Hi Fatimah,</p><p>Sade has ${esc(an(d.kind))} ready for you.</p>${d.to?`<p style="color:#666">To: ${esc(d.to)}${d.subject?'<br>Subject: '+esc(d.subject):''}</p>`:''}<div style="border-left:3px solid #b8943f;padding:6px 14px;margin:12px 0;background:#faf7f0">${nl2(body)}</div>${links.approved?`<p>${btn(links.approved,'Approve','#2f6b45')}${btn(links.changes,'Ask for changes','#8a6d1f')}${btn(links.declined,'Decline','#8a3b3b')}</p>`:''}<p><a href="${deskLink(d.id)}">Open it in the desk</a></p></div>`;
  return {to:EML.Fatimah(),subject:head,text,html};
}

/* CSV and paste import */
function parseCsv(t){
  t=String(t||'').replace(/^﻿/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"') q=false;else c+=ch}
    else if(ch==='"') q=true;else if(ch===','||ch==='\t'){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n') i++;r.push(c);c='';if(r.some(x=>x.trim())) rows.push(r);r=[]}
    else c+=ch}

const STMAP={'new':'New','contacted':'Contacted','test sent':'Test sent','active':'Active','keep':'Keep on file','keep on file':'Keep on file','writers list':'Keep on file','declined':'Declined'};
function csvPeople(t){
  const rows=parseCsv(t);if(rows.length<2) return [];
  const h=rows[0].map(x=>x.trim().toLowerCase()),ix=(...k)=>h.findIndex(x=>k.some(y=>x.startsWith(y)));
  const cN=ix('full name','name'),cE=ix('email'),cC=ix('category','strong'),cY=ix('years'),cS=ix('status'),cSo=ix('source'),cNo=ix('notes'),cR=ix('role');
  if(cN<0) return [];
  return rows.slice(1).map(r=>{const g=i=>i<0?'':String(r[i]||'').trim(),raw=g(cS),st=STMAP[raw.toLowerCase()]||'New',nt=g(cNo);
    return {name:g(cN),email:g(cE),strengths:g(cC),years:g(cY),status:st,source:g(cSo),notes:[nt,raw&&!STMAP[raw.toLowerCase()]?'Status in the sheet: '+raw:raw.toLowerCase()==='writers list'?'Status in the sheet: Writers list':''].filter(Boolean).join('. '),roles:cR>=0&&g(cR)?g(cR).split(/[;/]/).map(s=>s.trim()).filter(x=>CROLES.includes(x)):['Writer']}}).filter(p=>p.name);
}

const SYN={Style:'style fashion jewellery jeweller jewelry jewel beauty design couture clothing textile accessories runway',Lifestyle:'lifestyle travel food home wellness hospitality hotel dining interiors',Culture:'culture art music film museum gallery exhibition heritage history book theatre',Wealth:'wealth money finance business investing bank economy property'};
function matchPeople(text,role){
  const w=new Set((String(text||'').toLowerCase().match(/[a-z]{3,}/g)||[])),R=[];
  people().forEach(p=>{
    if(p.status==='Declined') return;let s=0;const why=[];
    const cat=(p.strengths||'').trim();
    if(cat){const syn=((SYN[cat]||'')+' '+cat.toLowerCase()).split(/\s+/);if(syn.some(x=>w.has(x))){s+=4;why.push('Strongest in '+cat)}}
    if(role&&role!=='Any'&&(p.roles||[]).includes(role)){s+=2;why.push(role)}else if(role&&role!=='Any'&&!(p.roles||[]).includes(role)) s-=3;
    const y=p.years||'';if(/>\s*5/.test(y)){s+=2;why.push('more than 5 years')}else if(/2-5/.test(y)){s+=1;why.push('2 to 5 years')}
    if(p.status==='Active'){s+=2;why.push('active')}else if(p.status==='Keep on file'){s+=1;why.push('kept on file')}else if(p.status==='Test sent'){s+=1;why.push('test sent')}
    const done=asgs().filter(a=>a.cid===p.id&&a.stage==='Published').length;if(done){s+=1;why.push(done+' published with us')}
    if(!p.email&&!p.phone){s-=1;why.push('no contact details yet')}
    R.push({p,s,why});
  });
  return R.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);
}

async function rsRun(name,region,existing){
  const qs=rqItems().filter(x=>!x.hide&&x.w);
  const pr=`Search the web about "${name}" as a sponsor prospect for The Leisurely Life Journal (TLLJ), a Nigerian luxury lifestyle and arts media brand. Use only facts you find. Where you cannot confirm something write exactly: Ask. Name the source site inside each text. Return ONLY JSON, no other text, with keys: "blocked" (true if it is an alcohol, tobacco or gambling brand, else false), "category" (2 to 4 words), "why" (max 60 words: why it fits TLLJ readers), "first" (who to approach first and how, or Ask), "propose" (max 50 words: a paid feature or event idea), "next" (one next step), "notes" (sources and caveats, max 60 words), "score" (integer 1 to 10, fit guess), "chance" (one of Likely, Feasible, Possible, Aspirational), "answers" (object: question id to answer, max 50 words each, or Ask). Questions: ${qs.map(q=>q.id+': '+String(q.q).replace(/\{sponsor\}/g,name)).join(' | ')}`;
  const o=rsParse(await aiText(pr,null,{search:true}));
  if(o.blocked===true||o.blocked==='true') return {blocked:true};
  return {o};
}
async function rsApply(p,o,isNew){
  const f={},put=(k,v)=>{if(!rsBlank(v)&&(isNew||rsBlank(p[k]))) f[k]=String(v).trim()};
  ['category','why','first','propose','next'].forEach(k=>put(k,o[k]));
  const line='Researched by Tilly on '+fmt(TODAY)+'. Check each source. '+String(o.notes||'').trim();
  f.notes=(p.notes?p.notes+'\n':'')+line;
  if(isNew){const sc=Math.round(+o.score);if(sc>=1&&sc<=10) f.score=sc;const L=optsOf('chance',['Likely','Feasible','Possible','Aspirational']);if(L.includes(o.chance)) f.chance=o.chance}
  await act('Research '+p.group,()=>patch('pipe',p.id,f));
  const d=get('kit','rqa_'+p.id)||{id:'rqa_'+p.id,type:'rqa',pipeId:p.id,a:{}},a={...(d.a||{})};let n=0;
  Object.entries(o.answers||{}).forEach(([k,v])=>{if(rsBlank(a[k])&&!rsBlank(v)){a[k]=String(v).trim();n++}});
  if(n) await act('Research answers',()=>save('kit','rqa_'+p.id,{...d,id:'rqa_'+p.id,type:'rqa',pipeId:p.id,a}));
  return n;
}

const GEN46=/^(gmail|yahoo|hotmail|outlook|icloud|live|msn|me|aol|proton|protonmail|zoho|zohomail|mail)$/;
function csv46(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"') q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n') i++;r.push(c);c='';if(r.some(x=>x.trim())) rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x.trim())) rows.push(r);
  if(rows.length<2) return [];
  const h=rows[0].map(x=>x.trim().toLowerCase()),ix=re=>h.findIndex(x=>re.test(x));
  const iF=ix(/^(first name|given name)/),iL=ix(/^(last name|family name|surname)/),iN=ix(/^(name|full name|display name|contact name)$/),iE=ix(/e-?mail/),iP=ix(/(mobile|phone|tel)/),iO=ix(/(company|organi[sz]ation|account name)/),iT=ix(/(job title|^title$|designation)/);
  const g=(r,i)=>i>=0?String(r[i]||'').trim():'';
  return rows.slice(1).map(r=>({name:g(r,iN)||[g(r,iF),g(r,iL)].filter(Boolean).join(' '),email:g(r,iE).split(/[;,\s]/)[0].toLowerCase(),phone:g(r,iP),org:g(r,iO),role:g(r,iT)})).filter(x=>x.name||x.email);
}
function vcf46(t){const out=[];t=t.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').replace(/\r/g,'');
  t.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{const g=re=>{const m=b.match(re);return m?m[1].trim():''};
    let name=g(/^FN[^:\n]*:(.+)$/im);if(!name){const n=g(/^N[^:\n]*:(.+)$/im).split(';');name=((n[1]||'')+' '+(n[0]||'')).trim()}
    const em=[...b.matchAll(/^(?:item\d+\.)?EMAIL[^:\n]*:(.+)$/gim)].map(m=>m[1].trim().toLowerCase());
    const o={name,email:em[0]||'',phone:g(/^TEL[^:\n]*:(.+)$/im),org:g(/^ORG[^:\n]*:(.+)$/im).replace(/;/g,' ').trim(),role:g(/^TITLE[^:\n]*:(.+)$/im)};
    if(o.name||o.email) out.push(o)});return out}
const dom46=e=>{const m=String(e||'').match(/@([^@\s]+)$/);return m?m[1].toLowerCase():''};
const sld46=d=>{const p=d.split('.');return p.length>1?p[p.length-2]:''};
function match46(x){
  const em=(x.email||'').toLowerCase();
  if(em&&S.contacts.some(c=>String(c.email||'').toLowerCase()===em)) return {dup:true};
  const d=dom46(em),pdm=d&&!GEN46.test(sld46(d));
  if(pdm){const c=S.contacts.find(c=>c.pipeId&&dom46(String(c.email||'').toLowerCase())===d);if(c) return {pid:c.pipeId,why:'same email domain as '+(c.name||'a saved contact')}}
  const o=nz46(x.org);
  if(o.length>=4){const p=S.pipe.find(p=>{const g=nz46(p.group);return g===o||g.includes(o)||(o.includes(g)&&g.length>=4)});if(p) return {pid:p.id,why:'company matches'}}
  if(pdm){const s=sld46(d);if(s.length>=4){const p=S.pipe.find(p=>nz46(p.group).split(' ').includes(s)||nz46(p.group).replace(/ /g,'').startsWith(s));if(p) return {pid:p.id,why:'email domain matches '+p.group}}}
  const nm=nz46(x.name);
  if(nm.split(' ').length>=2){const c=S.contacts.find(c=>c.pipeId&&nz46(c.name)===nm);if(c) return {pid:c.pipeId,why:'same name as a saved contact'}}
  return {};
}

/* Push to Praise: only what moved, in full sentences */
handoverText=function(){
  const h=handoverData(),last=h.last||'',since=last?fmt(last.slice(0,10)):'the start';
  const A=S.activity.filter(a=>a.at>last).sort((a,b)=>a.at<b.at?-1:1),lastD=last?last.slice(0,10):'';
  const SP={},PT={},EV=[],CT=[],AS=[],DC=[];
  const g=(M,k)=>M[k]||(M[k]={st:null,added:false,cons:[],notes:[]});
  A.forEach(a=>(a.changes||[]).forEach(c=>{
    if(['Approval','Follow-up'].includes(c.kind)||c.col==='tasks'||c.col==='note') return;
    const w=c.what||'';
    if(c.col==='pipe'){const x=g(SP,c.name),m=/status: (.*?) → ([^;]*)/.exec(w);if(m) x.st=[x.st?x.st[0]:m[1],m[2]];if(w==='added') x.added=true}
    else if(c.kind==='Partner'){const x=g(PT,c.name),m=/stage: (.*?) → ([^;]*)/.exec(w);if(m) x.st=[x.st?x.st[0]:m[1],m[2]];if(w==='added') x.added=true}
    else if(c.col==='contacts'&&w==='added'){const ct=S.contacts.find(q=>nameOfRec('contacts',q)===c.name);const p=ct&&get('pipe',ct.pipeId);if(p&&c.name) g(SP,nameOfRec('pipe',p)).cons.push(ct.name||ct.email)}
    else if(c.col==='events'){const e=S.events.find(q=>nameOfRec('events',q)===c.name);if(e&&!EV.some(q=>q.id===e.id)) EV.push({id:e.id,name:e.name,added:w==='added',status:e.status})}
    else if(c.kind==='Contributor'&&w==='added') CT.push(c.name);
    else if(c.kind==='Assignment'&&w==='added') AS.push(c.name);
    else if(c.col==='decisions'&&/answer:/.test(w)){const d=S.decisions.find(q=>nameOfRec('decisions',q)===c.name);if(d&&d.answer&&!DC.some(q=>q.id===d.id)) DC.push(d)}
  }));
  S.log.filter(l=>l.date>=lastD&&l.summary).forEach(l=>{const p=get('pipe',l.pipeId);if(p){const x=SP[nameOfRec('pipe',p)];if(x) x.notes.push(nlg48(l.summary))}});
  const line=(n,x)=>{const o=[];if(x.added) o.push('new on the list');if(x.st) o.push('status '+x.st[0]+' → '+x.st[1]);if(x.cons.length) o.push(x.cons.length+' new contact'+(x.cons.length===1?'':'s')+' ('+[...new Set(x.cons)].join(', ')+')');[...new Set(x.notes)].slice(0,2).forEach(q=>o.push('note: '+q));return o.length?'- '+n+': '+o.join('; ')+'.':''};
  const sec=(title,rows)=>rows.length?title+'\n'+rows.join('\n'):'';
  const sp=Object.keys(SP).map(k=>{const p=S.pipe.find(q=>nameOfRec('pipe',q)===k);return line(p?p.group:k,SP[k])}).filter(Boolean);
  const pt=Object.keys(PT).map(k=>{const q=PTS().find(z=>nameOfRec('kit',z)===k);return line(q?q.name:k,PT[k])}).filter(Boolean);
  const ev=EV.map(e=>'- '+e.name+(e.added?' (added)':'')+(e.status?': '+nlg48(e.status):''));
  const co=[...(CT.length?['- New contributors: '+[...new Set(CT)].join(', ')+'.']:[]),...(AS.length?['- New assignments: '+[...new Set(AS)].join(', ')+'.']:[])];
  const dc=DC.map(d=>'- '+nlg48(d.decision)+' Answer: '+d.answer+(d.comment?' ('+nlg48(d.comment)+')':'')+'.');
  const lim=addDays(TODAY,14),open=h.open.filter(o=>o[3]&&nlg48(o[3])&&o[0]<=lim),later=h.open.filter(o=>o[3]&&o[0]>lim).length;
  const nx=open.map(o=>'- '+fmt(o[0])+' · '+o[2]+': '+nlg48(o[3]));
  if(later) nx.push('- '+later+' later step'+(later===1?' is':'s are')+' in the desk.');
  const ap=drafts().filter(d=>d.status==='approved').map(d=>'- '+(d.title||d.kind));
  const parts=[sec('Sponsors',sp),sec('Partners',pt),sec('Events',ev),sec('Contributors',co),sec('Decisions answered',dc),sec('Next steps',nx),sec('Approved, ready to send',ap)].filter(Boolean);
  const moved=sp.length+pt.length+ev.length+co.length+dc.length;
  return 'Tracker updates since '+since+'\n\n'+(moved?'':'Nothing has changed since the last push.\n\n')+parts.join('\n\n');
};

async function applyInner(){

  for(const x of r.log||[]){if(get('pipe',x.pipeId)&&await addLog(x.pipeId,x)) n++}
  for(const x of r.pipe||[]){const p=get('pipe',x.id);if(!p) continue;const u={};
    if(x.status&&STATUSES.includes(x.status)) u.status=x.status;if(x.next) u.next=x.next;if(dOK(x.nextDate)) u.nextDate=x.nextDate;
    if(x.notes) u.notes=((p.notes?p.notes+' ':'')+x.notes).trim();
    if(Object.keys(u).length&&await patch('pipe',p.id,u)){n++;if(u.status==='Agreed'&&!S.deals.some(d=>d.pipeId===p.id)) await newDeal(p.id)}}
  for(const x of r.steps||[]){if(!get('tasks',x.id)) continue;const u={};if(typeof x.done==='boolean') u.done=x.done;if(dOK(x.due)) u.due=x.due;if(x.action) u.action=x.action;if(Object.keys(u).length&&await patch('tasks',x.id,u)) n++}
  for(const x of r.newSteps||[]){if(await save('tasks',uid('t'),{week:'Added',dates:'',goal:'',action:x.action,target:'',owner:OWNERS().includes(x.owner)?x.owner:'Sade',done:false,due:dOK(x.due)?x.due:null})) n++}
  for(const x of r.events||[]){const ex=get('events',x.id);
    if(x.remove){if(ex){await remove('events',ex.id);n++}continue}
    const u={};['name','where','status','note'].forEach(k=>{if(x[k]) u[k]=x[k]});if(dOK(x.start)) u.start=x.start;if(dOK(x.end)) u.end=x.end;
    if(ex){if(Object.keys(u).length&&await patch('events',ex.id,u)) n++}
    else if(u.name&&u.start){if(await save('events',uid('e'),{end:u.start,who:'To decide',reach:'',how:'',...u})) n++}}
  for(const x of r.deals||[]){if(!get('pipe',x.pipeId)) continue;const ex=S.deals.find(d=>d.pipeId===x.pipeId);const u={};['deliverables','amount'].forEach(k=>{if(x[k]) u[k]=x[k]});if(['Not invoiced','Invoiced','Paid'].includes(x.invoice)) u.invoice=x.invoice;if(dOK(x.publishDate)) u.publishDate=x.publishDate;if(dOK(x.renewal)) u.renewal=x.renewal;
    if(!Object.keys(u).length) continue;if(ex){if(await patch('deals',ex.id,u)) n++}else if(await save('deals',uid('dl'),{pipeId:x.pipeId,deliverables:'',publishDate:null,amount:'',invoice:'Not invoiced',renewal:null,notes:'',...u})) n++}
  S.ai.prop=null;for(const q of ['#props','#dprops']){const bx=$(q);if(bx) bx.textContent=''}toast(n+' updates applied');
}

      if(ACTIVE.includes(P.status)) w(`${P.group} is ${P.status.toLowerCase()}. Removing it lowers the live count.`);
      const st=S.tasks.filter(x=>!x.done&&x.target===P.group);if(st.length) t(`${st.length} open plan step${st.length===1?'':'s'} point to this sponsor and will keep its name.`);

      else if(ACTIVE.includes(nw.status)&&!ACTIVE.includes(old.status)&&same.length) same.forEach(q=>w(`${q.group} in the same category is already ${q.status.toLowerCase()}. Offer a different slot.`));
      if(['Declined','On hold'].includes(nw.status)&&ACTIVE.includes(old.status)){

      if(tot>=6&&L[top]/tot>.7) w(`${top} would hold ${Math.round(L[top])} of ${Math.round(tot)} open items.`,nw.owner!=='Both'?{label:'Set the owner to Both',col:'pipe',id:nw.id,patch:{owner:'Both'}}:null)}

      const n=loadOn(nw.due,nw.id);if(n>=3){const d=lighterDay(nw.due,nw.id);w(`${n} other things are already due on ${fmt(nw.due)}.`,d?{label:`Move this to ${fmt(d)}`,col:'tasks',id:nw.id,patch:{due:d}}:null)}

      if(mates.length>1&&(nw.due<mates[0]||nw.due>mates[mates.length-1])) t(`Other steps in ${nw.week} fall between ${fmt(mates[0])} and ${fmt(mates[mates.length-1])}. Check the week label.`)}
    if(old&&nw.owner!==old.owner){const L=ownerLoad(nw.id),a=nw.owner;if(a==='Both'){L.Sade+=.5;L.Fatimah+=.5}else if(L[a]!=null) L[a]++;const tot=L.Sade+L.Fatimah,top=L.Sade>=L.Fatimah?'Sade':'Fatimah';
      if(tot>=6&&L[top]/tot>.7) w(`${top} would hold ${Math.round(L[top])} of ${Math.round(tot)} open items.`,a!=='Both'?{label:'Set the owner to Both',col:'tasks',id:nw.id,patch:{owner:'Both'}}:null)}

  return W;
}

}
async function removeSponsor(id){
  const p=get('pipe',id);if(!p) return false;
  const ok=await guard('pipe',p,null,'Remove '+p.group.slice(0,24),async()=>{
    for(const c of contactsOf(id)) await remove('contacts',c.id);

const NAMEKEY={pipe:'group',tasks:'action',events:'name',contacts:'name',decisions:'decision',kit:'title',prep:'text'};
const FRIENDLY={pipe:'Sponsor',tasks:'Plan step',events:'Event',contacts:'Contact',decisions:'Decision',kit:'Proposal Kit',prep:'Event prep',deals:'Deal',log:'Outreach log'};
const shortV=v=>{v=v==null||v===''?'blank':String(v);return v.length>48?v.slice(0,48)+'…':v};
function nameOfRec(col,r){if(!r) return '';if(col==='kit'&&(r.type==='partner'||r.type==='ptpl')) return shortV(r.name);if(col==='kit'&&r.type==='followup') return String(r.text||'');if(col==='kit'&&r.type==='contributor') return r.name;if(col==='kit'&&(r.type==='assignment'||r.type==='draft')) return shortV(r.title||r.kind);if(col==='log'||col==='deals'){const p=get('pipe',r.pipeId);return (p?p.group+': ':'')+(col==='log'?(r.type+' '+(r.summary||'')).trim():'Deal tracker')}if(col==='contacts'&&!r.name&&r.email) return r.email;return shortV(r[NAMEKEY[col]]||r.id)}
function diffOf(col,prev,now){
  if(!prev&&now) return 'added';if(prev&&!now) return 'removed';
  const skip=new Set(['id','checks','n','rows','items','body','fee','paidOn','rounds','cid','forId','linkId','sentAt','decidedAt','decidedBy','sentOn','at','by','contribs']);const out=[];
  Object.keys(now).forEach(k=>{if(skip.has(k)||JSON.stringify(prev[k])===JSON.stringify(now[k])) return;out.push(k+': '+shortV(prev[k])+' → '+shortV(now[k]))});
  if(col==='kit'&&JSON.stringify(prev.rows)!==JSON.stringify(now.rows)) out.push('rate card edited');
  if(col==='kit'&&JSON.stringify(prev.items)!==JSON.stringify(now.items)) out.push('ideas edited');
  if(col==='kit'&&prev.body!==now.body) out.push('template text edited');
  if(JSON.stringify(prev.checks)!==JSON.stringify(now.checks)&&now.checks) out.push('proposal checklist updated');
  if(col==='kit'&&now.type==='assignment'&&prev.cid!==now.cid) out.push('writer: '+(cname(now.cid)||'none'));
  if(col==='kit'&&now.type==='assignment'&&JSON.stringify(prev.rounds||[].map(r=>r.status))!==JSON.stringify(now.rounds||[].map(r=>r.status))) out.push('pitch round updated');
  if(now.type==='draft'&&prev.status!==now.status) out.push('status: '+(DST[prev.status]||prev.status)+' → '+(DST[now.status]||now.status));
  return out.filter(x=>!(now.type==='draft'&&/^status: (draft|pending|approved|changes|declined|sent) /.test(x))).slice(0,4).join('; ')||'edited';
}

function recordActivity(label,items){

  try{
    const seen=new Set(),ch=[];
    items.forEach(it=>{const k=it.col+'/'+it.id;if(seen.has(k)||['activity','evsug'].includes(it.col)) return;seen.add(k);const now=get(it.col,it.id);
      const rr=(now||it.prev)||{},isK=it.col==='kit'&&['contributor','assignment','draft'].includes(rr.type),isP=it.col==='kit'&&rr.type==='partner',isF=it.col==='kit'&&rr.type==='followup',isC=it.col==='kit'&&rr.type==='coverage';ch.push({col:it.col,m:isK?'c':isP?'p':isC?(get('kit',rr.pipeId)?'p':'s'):isF?(rr.mode==='P'?'p':rr.mode==='Both'?'b':'s'):it.col==='events'?'b':'s',kind:isK?(rr.type==='contributor'?'Contributor':rr.type==='assignment'?'Assignment':'Approval'):isF?'Follow-up':isP?'Partner':isC?'Coverage':(FRIENDLY[it.col]||it.col),name:nameOfRec(it.col,now||it.prev),what:diffOf(it.col,it.prev,now)})});

    if(last&&last.label===label&&Date.now()-new Date(last.at)<60000&&last.changes[0]&&ch[0]&&last.changes[0].name===ch[0].name) return;
    const doc={id:uid('a'),at:new Date().toISOString(),label:String(label).slice(0,120),by:window.TLLJ_USER||'You',changes:ch.slice(0,12),count:ch.length};

  }catch(e){}
}

function keepCh(c){const w=c.what||'';

    doc:id=>({async get(){return {data:()=>read(c)[id]}},async set(d){const o=read(c);o[id]=d;write(c,o);emit(c)},async delete(){const o=read(c);delete o[id];write(c,o);emit(c)}})})};

  async function call(prompt,search){

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
